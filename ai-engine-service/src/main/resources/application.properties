# Application
spring.application.name=ai-engine-service
server.port=8083

# ===============================
# GEMINI CHAT
# ===============================
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.response-mime-type=application/json

# ===============================
# GEMINI EMBEDDING
# ===============================
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.model=text-embedding-004
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# ===============================
# RABBITMQ
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ===============================
# QDRANT
# ===============================
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=career_vectors
spring.ai.vectorstore.qdrant.initialize-schema=true

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info













