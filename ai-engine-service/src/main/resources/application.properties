spring.application.name=ai-engine-service

server.port=8083

# # Google GenAI
# spring.ai.google.genai.api-key= 
# spring.ai.google.genai.chat.model=gemini-2.5-flash
# spring.ai.google.genai.project-id=
# # $env:GOOGLE_API_KEY="KEY_CỦA_BẠN"
# # $env:GOOGLE_CLOUD_PROJECT="project-id-cua-ban"

# Gemini Chat
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT}

# Gemini Embedding
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.model=text-embedding-004
spring.ai.google.genai.embedding.project-id=${GOOGLE_CLOUD_PROJECT}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Qdrant
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334

# Actuator
management.endpoints.web.exposure.include=health,info