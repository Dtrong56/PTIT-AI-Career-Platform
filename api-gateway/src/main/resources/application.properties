spring.application.name=api-gateway

server.port=8080

# Identity Service
spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Core Platform Service
spring.cloud.gateway.server.webflux.routes[1].id=core-platform-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/core/**

# AI Engine Service
spring.cloud.gateway.server.webflux.routes[2].id=ai-engine-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/ai/**

# Dashboard Service
spring.cloud.gateway.server.webflux.routes[3].id=dashboard-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/dashboard/**

# Actuator
management.endpoints.web.exposure.include=health,info,gateway